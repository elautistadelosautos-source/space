<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Enlaces</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #38bdf8;
      margin: 0 auto 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.4rem; color: #f8fafc; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    /* Estilo de los botones */
    .link-btn {
      display: block;
      background: #334155;
      color: #ffffff;
      text-decoration: none;
      padding: 0.85rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      border: 1px solid #475569;
      transition: all 0.2s ease-in-out;
    }
    
    .link-btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="profile-img">🚗</div>
    <h1>Space Autos</h1>
    <p>Mis proyectos y redes sociales</p>

    <div class="links-container">
      <!-- Cambia las URLs (href) y el texto por lo que tú quieras -->
      <a href="https://google.com" target="_blank" class="link-btn">🌐 Mi Sitio Web</a>
      <a href="https://youtube.com" target="_blank" class="link-btn">📺 Canal de YouTube</a>
      <a href="https://instagram.com" target="_blank" class="link-btn">📸 Instagram</a>
      <a href="https://github.com" target="_blank" class="link-btn">💻 Proyectos en GitHub</a>
    </div>
  </div>

</body>
</html>
